<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <section class="login">
        <h2>OOZY COFFEE</h2>
        <form action="#" method="get">
            <!-- 이메일과 비밀번호 입력 CSS -->
            <div class="input_box">
                <input type="email" placeholder="이메일을 입력해 주세요"/>
                <input type="password" placeholder="비밀번호를 입력해 주세요"/>
            </div>
            <!-- 로그인 버튼 CSS -->
            <!-- <div class="btn_login"> -->
            
            <button type="submit">로그인</button>
            <!-- </div> -->
        </form>

        <!-- 로그인 버튼 바로 및 CSS -->
        <div class="login_addition">
            <div class="group">
                <input type="checkbox" id = "retain_login"/>
                <label class = "retain" for = "retain_login">로그인 상태 유지</label>
            </div>
            <a href="#">아이디 · 비밀번호 찾기</a>
        </div>

        <!-- SNS 간편 로그인 CSS -->
         <div class="easy_login">
            <h3>
                SNS 간편 로그인
            </h3>
         
            <ul>
                <li class="naver">
                    <a href="#" target="_blank" title = "네이버 바로가기">
                    <img  src="images/sns_naver.svg" alt = "네이버"/>
                    </a>
                </li>
                <li class="kakao">
                    <a href="#" target="_blank" title = "카카오톡 바로가기">
                    <img src="images/sns_kakao.svg" alt = "카톡"/>
                    </a>
                </li>
                <li class="face">
                    <a href="#" target="_blank" title = "페이스북 바로가기">
                    <img src="images/sns_facebook.svg" alt = "페이스북"/>
                    </a>
                </li>
                <li class="google">
                    <a href="#" target="_blank" title = "구글 바로가기">
                    <img src="images/sns_google.svg" alt = "구글"/>
                    </a>
                </li>
                <li class="apple">
                    <a href="#" target="_blank" title = "애플 바로가기">
                    <img src="images/sns_apple.svg" alt = "애플"/>
                    </a>
                </li>
            </ul>
        </div>


        <!-- 회원가입 버튼 CSS -->
        <div class="join_membership">
            <a href = "member.html">회원가입</a>
        </div>

        <!-- 가장 아래 문구 -->
        <div class="bottom">
            <span>회원가입 하면 <strong>10만원 쿠폰팩을 </strong>드려요!</span>
        </div>
    </section>
</body>
</html>
