<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 설명</title>
    <style>
        /* p 태그의 우선순위가 존재, p태그이면 무조건 색 변경됨 */
        p {
            color : red;
        }
        /* 붙어있는 경우 : p라는 태그의 class이름이 center인 경우만 css 적용 */
        p.center{
            color : dodgerblue;
        }
        /* 떨어져 있는 경우 : p라는 태그의 안에 자식의 class 이름이 center인 경우 css 적용 */
        p .center{
            color : green;
        }
        /* div span => div 안의 자식/자손 모두 css 적용 */
        div span{
            background-color:aquamarine;
        }
        /* div > span => div 안의 자식만 css 적용 */
        div > span{
            color : darkviolet;
        }
        div.center{
            background-color: yellow;
        }
        .center02{
            color : red;
        }
    </style>
</head>
<body>
    <p class = "center">이건 파란색</p>
    <div class = "center">이건 선택 안됨1</div>
    <div class = "center center02"><em><span>이건 선택 안됨2</span></em></div>

    <p><span class = "center">이건 선택 안됨3</span></p>
    <p><span><stong class = "center">이건 선택 안됨4</strong></span></p>
</body>
</html>
