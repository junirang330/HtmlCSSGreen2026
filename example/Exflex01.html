<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex01</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            padding: 20px;
            font-family: sans-serif;
            font-size: 16px;
        }
        .nav{
            /* flex 속성은 부모요소에 작성 */
            display: flex;
            flex-wrap: warp;
            justify-content: space-evenly;
            align-items: center;
            height: 100px;
            width: 100%;
            background-color: lightgray;
            list-style: none;
            margin: 0 auto;  /* ★★★★★ */
            padding: 5px;
            border: 1px solid red;
        }
        li{
            /* text-decoration: none; */
            /* margin-right: 50px; */
            /* flex: 1; */
            /* cursor: pointer; */
            border: 1px solid blue;
            /* line-height: 100px; */
            text-align: center;
        }
        a{
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <ul class="nav">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</body>
</html>
