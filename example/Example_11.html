<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제02</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-size: 16px;
            font-family: sans-serif, arial;
        }
        .total{
            padding: 20px;
        }
        .title{
            border-radius: 10px;
            background-color: black;
            width: 700px;
            padding: 20px;
            box-shadow: 5px 5px 20px rgba(0,0,0, 1);
        }
        h1{
            color: white;
            text-align: center;
        }
        ul{
            margin-top: 20px;
            padding-left: 10px;
            line-height: 40px;
        }
        li{
            list-style: none;
            font-weight: 500;
        }
        span{
            color: blue;
            text-decoration: underline;
            font-weight: 800;
        }

    </style>
</head>
<body>
    <div class = "total">
        <div class = "title">
            <h1>Best Coffee Beans of the World</h1>
        </div>
        <ul>
            <li>
                <span>Ethiopia Yirgacheffe</span> : Known for its bright acidity and floral, citrus notes.
            </li>
            <li>
                <span>Colombia Supremo</span> : Balanced flavor with a nutty, caramel sweetness.
            </li>
            <li>
                <span>Guatemala Antigua</span> : Rich body with smoky, chocolate undertones.
            </li>
        </ul>
    </div>

</body>
</html>
