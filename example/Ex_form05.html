<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제05</title>
    <!-- ex_form05.css 파일을 link로 연결한다 -->
    <link rel="stylesheet" href="/styleCss/Ex_form05.css">
</head>
<body>
    <h3>여름방학 특강 신청하기</h3>
    <form action = "#" method = "get">
        <fieldset>
            <legend>교육과정</legend>
            <ul>
                <li class="level">
                    <label class ="title">영어회화</label>
                    <input type = "text" readonly value = "오전 9:00~11:00" />
                    <span>(초급레벨)</span>
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>신청자 기본 정보</legend>
            <ul>
                <li>
                    <label class = "title" for = "name">이름</label>
                    <input type= "text" id = "name" placeholder = "이름 입력"/>
                </li>
                <li>
                    <label class = "title" for = "email">이메일</label>
                    <input type= "email" id = "email" placeholder = "이메일 입력"/>
                </li>
                <li>
                    <label class = "title" for = "pw">비밀번호</label>
                    <input type= "password" id = "pw" placeholder = "비밀번호 입력"/>
                </li>
                <li>
                    <label class = "title">학과</label>
                    <select>
                        <option value="">학과를 선택하세요</option>
                        <option value = "컴퓨터공학과">컴퓨터공학과</option>
                        <option value = "국어국문학과">국어국문학과</option>
                        <option value = "영어영문학과">영어영문학과</option>
                        <option value = "전자 융합과">전자 융합과</option>
                    </select>
                </li>
                <li class = "gender_item">
                    <span class = "title">성별</span>
                    <input type = "radio" checked id="man" name = "gender" />
                    <label for = "man">남자</label>
                    <input type = "radio" id="woman" name = "gender" />
                    <label for = "woman">여자</label>
                </li>
                <li class = "hobby_item">
                    <span class = "title">관심사</span>
                    <input type="checkbox" id = "ho1" name = "hobby"/>
                    <label for="ho1">여행</label>
                    <input type="checkbox" id = "ho2" name = "hobby"/>
                    <label for="ho2">게임</label>
                    <input type="checkbox" id =  "ho3" name = "hobby"/>
                    <label for="ho3">공연</label>
                    <input type="checkbox" id =  "ho4" name = "hobby"/>
                    <label for="ho4">운동</label>
                    <input type="checkbox" id =  "ho5" name = "hobby"/>
                    <label for="ho5">기타</label>
                </li>
            </ul>
        </fieldset>
        <!-- 의미없는 태그 <div>이용 : 그룹을 묶을때, 사용하면 유용함 -->
        <div class = "btn">
            <button type = "submit">수강신청</button>
            <button type = "reset">다시쓰기</button>
        </div>
    </form>

</body>
</html>
