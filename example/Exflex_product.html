<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제05</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html{
            /* height: 100%; */
        }
        body{
            font-family: sans-serif;
            font-size: 12px;
            padding: 20px;
            height: 100%;
        }
        .group{
            height: 100%;
            margin: 0 auto;
        }
        /* item CSS */
        .item{
            width:180px;
            margin-right: 15px; 
        }
        /* image_group CSS */
        .image_group{
            position: relative;
            
        }
        
        /* 배지 CSS */
        .image_group .badge{
            position: absolute;
            /* float: right; */
            bottom: 8%;
            right: 4%;
            background-color: black;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            padding:5px;
            text-align: center;
            z-index: 3;
            opacity: 0.4;
        }
        .badge_pick{
            position: absolute;
            bottom: 12%;
            right: 9%;
            opacity: 100;
            z-index: 100;
        }
        .pick{
            color: white;
            font-weight: bolder;
        }
        .group{
            display: flex;
            /* justify-content: center; */
        }
        /* details 전체 CSS */
        .details div{
            margin-bottom: 3px;
        }
        .details .last_line{
            display: flex;
            justify-content: left;
        }
        /*  */
        /* 원래가격 CSS */
        .original_price{
            color: gray;
        }
        /* 할인 CSS */
        .discount{
            color: red;
            font-weight: bold;
            width: 40px;
            font-size: 14px;
        }
        /* 최종가격 CSS */
        .price{
            font-weight: bold;
            font-size: 14px;
        }
        .pick::before{
             content: '©';

        }
    </style>
</head>
