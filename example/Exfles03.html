<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }  
        html{
            height: 100%;
        }
        /* 화면 가운데로 맞추려면, 
           html: height 100%;
           body: height 100%;
        */
        body{
            font-family: sans-serif;
            font-family: 16px;
            padding: 20px;
            /* 화면 정중앙에 위치 */
            display: flex;
            /* 가로 가운데 */
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            height: 100%;
        }
        .login-box{
            /* margin: 0 auto; */
            /* height: 100%; */
            background-color: white;
            width: 300px;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 5px 5px 12px rgba(0,0,0, 0.3);

        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
    <h2>Login</h2>
    <input type="text" placeholder="아이디 입력" />
    <input type="password" placeholder="비밀번호 입력" />
    <button>로그인</button>
    </div>
</body>
</html>
