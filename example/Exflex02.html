<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex01</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            padding: 20px;
            font-family: sans-serif;
            font-size: 16px;
        }
        .card-container{
            display: flex;
            color: white;   
            align-items: center;
            justify-content: center;
            width: 1500px;
            margin: 0 auto;
            text-align: center;
            /* gap: 10px; */
            
        }
        .card{
            background-color: dodgerblue;
            width: 250px;
            padding: 20px 10px;
            height: 100px;
            /* line-height: -200px;            */
            display: flex;
            justify-content: center;
            flex-direction: column;
            border-radius: 10px;
            line-height: 30px;
            margin-left: 10px;
        }
        .card h3{
            font-size: 14px;
        }
        .card p{
            font-size: 12px;
        }

    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h3>Card1</h3>
            <p>첫 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card2</h3>
            <p>두 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card3</h3>
            <p>세 번째 카드 설명입니다.</p>
        </div>
    </div>
</body>
</html>
