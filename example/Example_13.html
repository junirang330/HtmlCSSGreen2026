<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제04</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: sans-serif;
            background-color: #f0f0f0;
        }
        .menu{
            background-color: #F5ECD7;
            border: 1px solid #ccc;
            border-radius: 15px;
            width: 520px;
            padding: 30px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
            margin: 0 auto;
            margin-top: 40px;
        }
        h1{
            text-align: center;
            letter-spacing: 10px;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        ul{
            list-style: none;
        }
        li{
            text-transform: uppercase;
            padding: 10px 0;
        }
        .box{
            border-bottom: 1px dashed black;
            padding-bottom: 10px;
        }
        span{
            float: right;
        }
    </style>
</head>
<body>
    <div class = "menu">
        <h1>Café Menu</h1>
        <ul>
            <li>
                <div class="box">
                    americano<span>$3.50</span>
                </div>
            </li>
            <li>
                <div class="box">
                    latte<span>$4.00</span>
                </div>
            </li>
            <li>
                <div class="box">
                    cappucino<span>$4.20</span>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
