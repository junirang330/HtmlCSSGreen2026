<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140">
  <!-- 전체 스타일 (글꼴 등) -->
  <style>
    .bsi-text { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #222222; }
    .iso-text-main { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #333333; }
    .iso-text-sub { font-family: 'Arial', sans-serif; font-size: 13px; fill: #555555; }
  </style>

  <!-- 첫 번째 마크: ISO/IEC 27001 (왼쪽) -->
  <g transform="translate(10, 10)">
    <!-- 왼쪽 BSI 동그라미 테두리 -->
    <circle cx="55" cy="60" r="55" fill="none" stroke="#222222" stroke-width="3"/>
    
    <!-- BSI 텍스트 -->
    <text x="55" y="40" class="bsi-text" text-anchor="middle">bsi</text>
    
    <!-- Kitemark (하트/연필 모양) -->
    <path d="M 55 50 C 40 50, 25 65, 55 90 C 85 65, 70 50, 55 50 Z" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
    <path d="M 55 65 L 55 85" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"/>

    <!-- 오른쪽 정보 둥근 사각형 테두리 -->
    <path d="M 110 5 H 200 A 55 55 0 0 1 200 115 H 110 Z" fill="none" stroke="#222222" stroke-width="3"/>
    
    <!-- ISO 27001 정보 텍스트 -->
    <text x="125" y="35" class="iso-text-main">ISO/IEC</text>
    <text x="125" y="55" class="iso-text-main">27001</text>
    <text x="125" y="75" class="iso-text-sub">Information Security</text>
    <text x="125" y="90" class="iso-text-sub">Management</text>
    <text x="125" y="105" class="iso-text-sub">CERTIFIED</text>
  </g>

  <!-- 두 번째 마크: ISO/IEC 27017 (오른쪽) -->
  <g transform="translate(240, 10)">
    <!-- 왼쪽 BSI 동그라미 테두리 -->
    <circle cx="55" cy="60" r="55" fill="none" stroke="#222222" stroke-width="3"/>
    
    <!-- BSI 텍스트 -->
    <text x="55" y="40" class="bsi-text" text-anchor="middle">bsi</text>
    
    <!-- Kitemark (하트/연필 모양) -->
    <path d="M 55 50 C 40 50, 25 65, 55 90 C 85 65, 70 50, 55 50 Z" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
    <path d="M 55 65 L 55 85" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"/>

    <!-- 오른쪽 정보 둥근 사각형 테두리 -->
    <path d="M 110 5 H 200 A 55 55 0 0 1 200 115 H 110 Z" fill="none" stroke="#222222" stroke-width="3"/>
    
    <!-- ISO 27017 정보 텍스트 -->
    <text x="125" y="35" class="iso-text-main">ISO/IEC</text>
    <text x="125" y="55" class="iso-text-main">27017</text>
    <text x="125" y="75" class="iso-text-sub">Cloud Security</text>
    <text x="125" y="90" class="iso-text-sub">Management</text>
    <text x="125" y="105" class="iso-text-sub">CERTIFIED</text>
  </g>
</svg>
