<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 회원가입</title>
    <link rel="stylesheet" href="styleCss/kurly_join.css">
</head>
<body>
    <h1>회원가입</h1>
    <form action="#" method = "get">
        <caption>
            필수 입력사항
        </caption>

        <ul>
            <li>
                <span class = "group" for = "id">아이디</span>
                <input type = "text" id = "id" placeholder="아이디를 입력해주세요"/>
            </li>
            <li>
                <span class = "group" for = "pw">비밀번호</span>
                <input type = "password" id = "pw" placeholder="비밀번호를 입력해주세요"/>
            </li>
            <li>
                <span class = "group" for = "pwchk">비밀번호확인</span>
                <input type = "password" id = "pwchk" placeholder="비밀번호를 한번 더 입력해주세요"/>
            </li>
            <li>
                <span class = "group" for = "name">이름</span>
                <input type = "text" id = "name" placeholder="이름을 입력해 주세요"/>
            </li>
            <li>
                <span class = "group" for = "email">이메일</span>
                <input type = "email" id = "email" placeholder="예: marketkurly"/>
                <select>
                    <option>선택하기</option>
                    <option value = "naver.com" placeholder = "선택하기">naver.com</option>
                    <option value = "gmail.com">gmail.com</option>
                    <option value = "hanmail.com">hanmail.com</option>
                    <option value = "kakao.com">kakao.com</option>
                    <option value = "daum.net">daum.net</option>
                    <option value = "hotmail.com">hotmail.com</option>
                    <option value = "yahoo.co.kr">yahoo.co.kr</option>
                    <option value = "직접 입력">직접 입력</option>
                </select>
            </li>
            <li>
                <span class = "group" for = "phone">휴대폰</span>
                <input type = "tel" id = "phone" placeholder="숫자만 입력해주세요."/>
                <button class = "certify" type = "button">인증번호 받기</button> 
            </li>
            <li>
                <span class = "group" for "address">주소</span>
                <button type = "button" id = "address">주소 검색</button>
                <div class = "explain">배송시에 따라 상품 정보가 달라질 수 있습니다.</div>
            </li>
            <li class = "gender_item">
                <span class = "group">성별</span>
                <input type = "radio" name = "gender" id = "male"/>
                <label for = "male">남자</label>
                <input type = "radio" name = "gender" id = "female"/>
                <label for = "female">여자</label>
                <input type = "radio" name = "gender" id = "none"/>
                <label for = "none">선택안함</label>
            </li>
            <li>
                <label class = "group" for "birthday">생년월일</label>
                <input type = "date"
            </li>
        </ul>


    </form>


</body>
</html>
